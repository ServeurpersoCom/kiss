! server.conf: the defaults the KiSS server embeds, below server.conf of the
! directory it runs in; a shell whose program a machine lacks stays out there
set server host 127.0.0.1
set server port 8089
set server log debugging
set server buffered 65536
set shells command bash bash -s
set shells timeout bash 290
set shells output bash 65536
set shells command zsh zsh -s
set shells timeout zsh 290
set shells output zsh 65536
set shells command powershell "powershell -NoProfile -NonInteractive -Command \"[Console]::OutputEncoding = [Text.UTF8Encoding]::new($false); $m = New-Object IO.MemoryStream; [Console]::OpenStandardInput().CopyTo($m); Invoke-Expression ([Text.Encoding]::UTF8.GetString($m.ToArray()) + [char]10 + 'if (-not $?) { if ($LASTEXITCODE) { exit $LASTEXITCODE }; exit 1 }')\""
set shells timeout powershell 290
set shells output powershell 65536
set shells command pwsh "pwsh -NoProfile -NonInteractive -Command \"[Console]::OutputEncoding = [Text.UTF8Encoding]::new($false); $m = New-Object IO.MemoryStream; [Console]::OpenStandardInput().CopyTo($m); Invoke-Expression ([Text.Encoding]::UTF8.GetString($m.ToArray()) + [char]10 + 'if (-not $?) { if ($LASTEXITCODE) { exit $LASTEXITCODE }; exit 1 }')\""
set shells timeout pwsh 290
set shells output pwsh 65536
set view output 65536
set view image 52428800
set view pixels 100000000
set view side 1920
set view quality 85
